name: Supabase keep-alive

# Calls the admin app's /api/health once a day, which runs one query against the
# Supabase project so the free tier doesn't pause it after seven idle days. The
# admin's Vercel cron (admin/vercel.json) does the same; this is a second ping
# whose runs stay visible in the Actions tab, unlike Vercel's one-hour logs on
# Hobby. A failed run (anything but HTTP 200 with "ok":true) emails the owner.
#
# It needs one repository secret, CRON_SECRET: the same value as the
# dainorelis-admin Vercel project's CRON_SECRET.
on:
  schedule:
    # Twelve hours off the Vercel cron (07:00 UTC), so the two don't overlap.
    - cron: '17 19 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          body=$(curl -sS --retry 3 --retry-all-errors --max-time 30 \
            -H "Authorization: Bearer $CRON_SECRET" \
            -w '\n%{http_code}' https://admin.dainorelis.app/api/health)
          status=${body##*$'\n'}
          echo "${body%$'\n'*}"
          echo "HTTP $status"
          [ "$status" = 200 ] && grep -q '"ok":true' <<<"$body"
